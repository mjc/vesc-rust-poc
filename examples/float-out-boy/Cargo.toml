[package]
name = "vesc-example-float-out-boy"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Unofficial Rust port of Refloat, renamed Float Out Boy to avoid confusion with the original package."

publish = false

[package.metadata.vescpkg]
name = "Float Out Boy"
version = "0.1.0"

[lints]
workspace = true

[features]
test-support = ["vescpkg-rs/test-support"]

[dependencies]
bitflags = { version = "2.13.1", default-features = false }
vesc-float-out-boy-leds = { path = "../../crates/vesc-float-out-boy-leds" }
vesc-float-out-boy-protocol = { path = "../../crates/vesc-float-out-boy-protocol" }
vescpkg-rs = { path = "../../crates/vescpkg-rs", features = ["alloc", "math"] }

[build-dependencies]
vescpkg-build-support = { path = "../../crates/vescpkg-build-support" }

[dev-dependencies]
vesc-float-out-boy-leds = { path = "../../crates/vesc-float-out-boy-leds", features = ["test-support"] }
vesc-float-out-boy-protocol = { path = "../../crates/vesc-float-out-boy-protocol", features = ["test-support"] }
vescpkg-rs = { path = "../../crates/vescpkg-rs", features = ["alloc", "math", "test-support"] }
